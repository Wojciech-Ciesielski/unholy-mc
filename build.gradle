plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }


repositories {
    maven { url = 'https://maven.nucleoid.xyz' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Polymer: server-side content for vanilla clients (bundled into our jar, server needs only us + Fabric API)
    for (String m : ['polymer-core', 'polymer-common', 'polymer-networking', 'polymer-reg-sync-manipulator', 'polymer-blocks', 'polymer-virtual-entity', 'polymer-resource-pack', 'polymer-autohost']) {
        implementation "eu.pb4:${m}:${project.polymer_version}"
        include "eu.pb4:${m}:${project.polymer_version}"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}

// test helper: prints the runtime classpath (used to start a plain vanilla client for multiplayer tests)
tasks.register('printClasspath') {
    doLast { println "CP=" + sourceSets.main.runtimeClasspath.asPath }
}
